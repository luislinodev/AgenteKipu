{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva tarea — AgenteKipu</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <header class="topbar">
        <h1>AgenteKipu</h1>
        <nav>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'crear_tarea' %}">Nueva tarea</a>
        </nav>
    </header>

    <main class="container">
        <h2>Crear tarea</h2>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="post" class="form">
            {% csrf_token %}

            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" required>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="4"></textarea>

            <label for="monto">Monto</label>
            <input id="monto" name="monto" type="number" step="0.0000001" min="0" required>

            <fieldset>
                <legend>Trabajador existente</legend>
                <label for="worker_id">Seleccionar</label>
                <select id="worker_id" name="worker_id">
                    <option value="">— Nuevo trabajador —</option>
                    {% for worker in workers %}
                        <option value="{{ worker.id }}">{{ worker.nombre }} ({{ worker.direccion_stellar }})</option>
                    {% endfor %}
                </select>
            </fieldset>

            <fieldset>
                <legend>O crear trabajador nuevo</legend>
                <label for="worker_nombre">Nombre</label>
                <input id="worker_nombre" name="worker_nombre" type="text">

                <label for="worker_direccion">Dirección Stellar</label>
                <input id="worker_direccion" name="worker_direccion" type="text" maxlength="56">
            </fieldset>

            <button type="submit">Guardar tarea</button>
        </form>
    </main>
</body>
</html>
