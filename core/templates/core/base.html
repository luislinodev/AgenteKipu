{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AgenteKipu{% endblock %}</title>
    <link rel="icon" href="{% static 'core/agentekipu_icon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
    <header class="topbar">
        <h1><a href="{% url 'dashboard' %}"><img class="brand-logo" src="{% static 'core/agentekipu_logo.svg' %}" alt="AgenteKipu"></a></h1>
        {% block nav %}
        <nav>
            <a href="{% url 'login' %}" class="btn btn-ghost">Entrar</a>
        </nav>
        {% endblock %}
    </header>

    <main class="container {% block container_class %}{% endblock %}"{% block main_attrs %}{% endblock %}>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
